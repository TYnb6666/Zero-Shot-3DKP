services:
  zerokey:
    image: wenrij/zerokey:latest
    build: .  # used by `docker compose build` to rebuild locally
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      # Dataset mounts (set host paths via shell env or .env file)
      - ${KEYPOINT_DATASET_PATH:-./data/keypointnet}:/data/keypointnet
      - ${COLMAP_DATA_PATH:-./data/colmap}:/data/colmap
      - ${HUMAN3M_DATA_PATH:-./data/human3m}:/data/human3m
      - ${SHAPENET_PART_ROOT:-./data/shapenetpart}:/data/shapenetpart
      - ${FIND3D_DATA_ROOT:-./data/find3d}:/data/find3d
      - ${PARTNET_ROOT:-./data/partnet}:/data/partnet
      - ${OBJAVERSE_GENERAL_ROOT:-./data/objaverse_general}:/data/objaverse_general
      # Checkpoints & experiments
      - ${POINTBERT_CKPT_DIR:-./model_ckpt}:/data/model_ckpt
      - ${POINTBERT_SEG_EXPERIMENTS:-./pointbert_seg_experiments}:/data/pointbert_seg_experiments
      # Output
      - ./results:/data/results
    environment:
      # Matches zerokey/_defaults.py env vars
      - ZEROKEY_LOG_DIR=/data/results
      - KEYPOINT_DATASET_PATH=/data/keypointnet
      - COLMAP_DATA_PATH=/data/colmap
      - HUMAN3M_DATA_PATH=/data/human3m
      - SHAPENET_PART_ROOT=/data/shapenetpart
      - FIND3D_DATA_ROOT=/data/find3d
      - PARTNET_ROOT=/data/partnet
      - OBJAVERSE_GENERAL_ROOT=/data/objaverse_general
      - POINTBERT_CKPT=/data/model_ckpt/2stagemodel.pt
      - POINTBERT_SEG_EXPERIMENTS=/data/pointbert_seg_experiments
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
