[project]
name = "zerokey"
version = "0.1.0"
description = "Zero-Shot 3D Keypoint Detection from Large Language Models"
authors = [
    {name = "Bingchen Gong"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["torch-redstone>=0.0.6,<0.0.7"]

[project.scripts]
zerokey = "zerokey.cli:main"

[build-system]
requires = ["setuptools>=80.10.2,<81"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["zerokey*", "kp_utils*", "data_creation*", "feature_backprojection*", "patchalign3d*", "clip_dinoiser*", "unsupervised_keypoints*", "ULIP*", "molmo*"]

# ── Pixi workspace ──────────────────────────────────────────────────

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]
preview = ["pixi-build"]

[tool.pixi.package]
name = "zerokey"
version = "0.1.0"

[tool.pixi.package.build]
backend = { name = "pixi-build-python", version = "*" }

[tool.pixi.package.host-dependencies]
python = "3.13.*"
setuptools = ">=80.10.2,<81"

[tool.pixi.dependencies]
python = "3.13.*"
pip = "*"
zerokey = { path = "." }

# Core scientific computing
numpy = ">=2.3.5,<3"
scipy = ">=1.17.0,<2"
scikit-learn = ">=1.8.0,<2"
pandas = ">=3.0.0,<4"
numba = ">=0.63.1,<0.64"
sympy = ">=1.14.0,<2"

# Visualization & rendering
matplotlib = ">=3.10.8,<4"
pillow = ">=12.1.0,<13"
open3d = ">=0.19.0,<0.20"
pyrender = ">=0.1.45,<0.2"
pyrr = ">=0.10.3,<0.11"
vtk = ">=9.5.2,<10"

# ML infrastructure
einops = ">=0.8.2,<0.9"
fast_hdbscan = ">=0.2.2,<0.3"
potpourri3d = ">=1.1.0,<2"
fvcore = ">=0.1.5.post20221221,<0.2"
iopath = ">=0.1.10,<0.2"

# Data & serialization
h5py = ">=3.15.1,<4"
protobuf = ">=6.31.1,<7"
grpcio = ">=1.73.1,<2"
ml_dtypes = ">=0.5.4,<0.6"
pyarrow = ">=23.0.0,<24"
datasets = ">=4.5.0,<5"
python-xxhash = ">=3.6.0,<4"
python-flatbuffers = ">=25.9.23,<26"

# NLP / tokenization / API
tokenizers = ">=0.22.2,<0.23"
openai = ">=2.17.0,<3"
huggingface_hub = ">=0.25.0,<1"
safetensors = ">=0.7.0,<0.8"
typer = ">=0.24.0,<0.25"

# TensorFlow & Keras (via conda for native deps)
keras = ">=3.12.0,<4"
tensorboard = ">=2.20.0,<3"
absl-py = ">=2.4.0,<3"
astunparse = ">=1.6.3,<2"
gast = ">=0.7.0,<0.8"
google-pasta = ">=0.2.0,<0.3"
opt_einsum = ">=3.4.0,<4"
optree = ">=0.18.0,<0.19"
wrapt = ">=2.1.1,<3"
namex = ">=0.1.0,<0.2"

# CLI & config
click = ">=8.3.1,<9"
fire = ">=0.7.1,<0.8"
tqdm = ">=4.67.3,<5"
configargparse = ">=1.7.1,<2"
nbformat = ">=5.10.4,<6"
rich = ">=14.3.2,<15"

# Text processing
ftfy = ">=6.3.1,<7"
regex = ">=2026.1.15,<2027"

# Misc utilities
easydict = ">=1.13,<2"
future = ">=1.0.0,<2"
networkx = ">=3.6.1,<4"
portalocker = ">=3.2.0,<4"
psutil = ">=7.2.2,<8"
wcwidth = ">=0.5.3,<0.6"
markupsafe = ">=3.0.3,<4"
jinja2 = ">=3.1.6,<4"
setuptools = ">=80.10.2,<81"
filelock = ">=3.20.3,<4"
fsspec = ">=2025.10.0,<2026"
pyyaml = ">=6.0.3,<7"

# Compilers for building CUDA extensions
# System GCC may be too old for PyTorch (needs 9+)
gxx = ">=11,<13.3"
cmake = ">=4.2.3"
ninja = ">=1.13.2"

# OpenCV
opencv = "*"

# Stable-keypoints baseline (unsupervised_keypoints)
wandb = ">=0.25.0,<0.26"
diffusers = ">=0.35.2,<0.36"

[tool.pixi.pypi-dependencies]
# PyTorch with CUDA support (resolved via extra-index-urls below)
torch = ">=2.9.1"
torchvision = "*"
torchaudio = "*"
triton = "*"

# PyTorch ecosystem
accelerate = ">=1.12.0, <2"
timm = ">=1.0.24, <2"
transformers = ">=4.45.0, <5"
pytorch-lightning = ">=2.6.1, <3"

# CLIP models
open-clip-torch = ">=3.2.0, <4"
clip = { git = "https://github.com/openai/CLIP.git" }

# TensorFlow
tensorflow = ">=2.20.0, <3"

# Point cloud utilities and ray tracing (used by data render)
point-cloud-utils = ">=0.34.0, <0.35"
embreex = ">=2.17.7, <3"

# Config (old pinned versions used by patchalign3d/)
hydra-core = ">=1.3.2, <2"
omegaconf = ">=2.3.0, <3"

# Build from forks with torch in build-system.requires (solves chicken-and-egg problem)
pytorch3d = { git = "https://github.com/gt4o4/pytorch3d.git" }
KNN-CUDA = { git = "https://github.com/gt4o4/KNN_CUDA.git" }
pointnet2-ops = { git = "https://github.com/gt4o4/Pointnet2_PyTorch.git", subdirectory = "pointnet2_ops_lib" }
mmcv = { git = "https://github.com/gt4o4/mmcv.git" }
mmsegmentation = { git = "https://github.com/gt4o4/mmsegmentation.git" }

[tool.pixi.pypi-options]
# PyTorch cu130 wheels
extra-index-urls = ["https://download.pytorch.org/whl/cu130"]
index-strategy = "unsafe-best-match"

[tool.pixi.system-requirements]
cuda = "13.0"

[tool.pixi.activation.env]
# Build/runtime parallelism
CMAKE_BUILD_PARALLEL_LEVEL = "4"
MAX_JOBS = "4"
OMP_NUM_THREADS = "4"
MKL_NUM_THREADS = "4"
OPENBLAS_NUM_THREADS = "4"
VECLIB_MAXIMUM_THREADS = "4"
NUMEXPR_NUM_THREADS = "4"
# Cache directories
HF_HOME = "$PIXI_PROJECT_ROOT/.cache/huggingface"
TORCH_HOME = "$PIXI_PROJECT_ROOT/.cache/torch"
TRITON_CACHE_DIR = "$PIXI_PROJECT_ROOT/.cache/triton"
# CUDA
CUDA_HOME = "/usr/local/cuda-13.0"
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib:$LD_LIBRARY_PATH"
# Compilers
CC = "$CONDA_PREFIX/bin/x86_64-conda-linux-gnu-gcc"
CXX = "$CONDA_PREFIX/bin/x86_64-conda-linux-gnu-g++"
CPP = "$CONDA_PREFIX/bin/x86_64-conda-linux-gnu-cpp"
CUDAHOSTCXX = "$CONDA_PREFIX/bin/x86_64-conda-linux-gnu-g++"
# Build tools
AR = "$CONDA_PREFIX/bin/x86_64-conda-linux-gnu-ar"
LD = "$CONDA_PREFIX/bin/x86_64-conda-linux-gnu-ld"
NM = "$CONDA_PREFIX/bin/x86_64-conda-linux-gnu-nm"
RANLIB = "$CONDA_PREFIX/bin/x86_64-conda-linux-gnu-ranlib"
STRIP = "$CONDA_PREFIX/bin/x86_64-conda-linux-gnu-strip"

[tool.pixi.feature.dev.dependencies]
pytest = ">=8.0,<9"
pyright = ">=1.1.408,<2"
conda = ">=26.1.0,<27"
mamba = ">=2.5.0"
uv = ">=0.10.0"
black = ">=26.1.0,<27"
flake8 = ">=7.3.0,<8"
flake8-comprehensions = ">=3.17.0,<4"
flake8-bugbear = ">=25.11.29,<26"
usort = ">=1.1.3,<2"

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
